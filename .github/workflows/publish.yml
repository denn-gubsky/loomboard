name: Publish

# Publishes @loomboard/chat (repo root), @loomboard/app (cli/) and
# @loomboard/workflow (packages/workflow/) to npm.
#
# Trigger: push a version tag, or run manually from the Actions tab.
#   v<version>            publishes @loomboard/chat and @loomboard/app
#   workflow-v<version>   publishes @loomboard/workflow, and nothing else
#   manual run            publishes all three
# The canvas package has its own tag because a `v*` tag also starts release.yml
# (desktop installers, the extension zip, a GitHub release), which a release of
# the canvas alone must not.
#
# Each package is published at the version in its own package.json and SKIPPED
# if that version is already on npm — so a shared tag can release both, re-runs
# are safe, and the packages may diverge in version. `prepack` rebuilds each package's artifacts at publish time; the gate
# below fails fast so we never publish a red build.
#
# Auth is npm trusted publishing (OIDC), with no token. Each of the three packages
# names this repo and this workflow file as its trusted publisher on npmjs.com
# (package → Settings → Trusted publisher → GitHub Actions: denn-gubsky /
# loomboard / publish.yml, no environment, with "npm publish" ticked under
# Allowed actions — entries made since 2026-09 allow only staged publishing by
# default, and a new entry expires unless its first publish lands within 2
# days). npm exchanges the job's OIDC token
# for a short-lived publish credential and attaches provenance itself. Renaming
# this file breaks publishing until the npm settings are changed to match.

on:
  push:
    tags: ["v*", "workflow-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # A version tag is only a trigger — the published version comes from each
      # package.json (npm rejects a version already on the registry). Fail loudly
      # if the tag matches neither package's version — the "tagged but forgot to
      # bump package.json" mistake — instead of silently skipping both.
      - name: Check tag matches a package version
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            workflow-v[0-9]*.[0-9]*.[0-9]*)
              tag="${REF#workflow-v}"
              wf=$(node -p "require('./packages/workflow/package.json').version")
              if [ "$tag" != "$wf" ]; then
                echo "::error::Tag $REF ($tag) does not match @loomboard/workflow ($wf). Bump packages/workflow/package.json before tagging."
                exit 1
              fi
              echo "· tag $REF matches workflow=$wf"; exit 0 ;;
            v[0-9]*.[0-9]*.[0-9]*) tag="${REF#v}" ;;
            *) echo "· $REF is not a vX.Y.Z tag — skipping check"; exit 0 ;;
          esac
          chat=$(node -p "require('./package.json').version")
          app=$(node -p "require('./cli/package.json').version")
          if [ "$tag" != "$chat" ] && [ "$tag" != "$app" ]; then
            echo "::error::Tag $REF ($tag) matches neither @loomboard/chat ($chat) nor @loomboard/app ($app). Bump package.json (npm version) before tagging."
            exit 1
          fi
          echo "· tag $REF matches chat=$chat app=$app"

      # Gate: don't publish anything if the build or tests are red. Build every
      # package up front so we never publish one and then fail on another. The
      # canvas package has its own tsconfig and tests (see ci.yml).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib
      - run: npm run build:standalone
      - run: npm -w @loomboard/workflow run typecheck
      - run: npm -w @loomboard/workflow run test
      - run: npm -w @loomboard/workflow run build:lib

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      # Runs only when every gate above passed, which the publish steps check.
      - id: npm11
        run: npm install -g npm@11

      # Each package is published even when one before it failed, so one run
      # shows every package's state (the job still fails) — but never after a
      # failed gate: npm11 only succeeds when every gate did.
      - name: Publish @loomboard/chat
        if: ${{ !cancelled() && steps.npm11.outcome == 'success' && (github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'workflow-v')) }}
        run: "$GITHUB_WORKSPACE/.github/scripts/npm-publish.sh"

      - name: Publish @loomboard/app
        if: ${{ !cancelled() && steps.npm11.outcome == 'success' && (github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'workflow-v')) }}
        working-directory: cli
        run: "$GITHUB_WORKSPACE/.github/scripts/npm-publish.sh"

      - name: Publish @loomboard/workflow
        if: ${{ !cancelled() && steps.npm11.outcome == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'workflow-v')) }}
        working-directory: packages/workflow
        run: "$GITHUB_WORKSPACE/.github/scripts/npm-publish.sh"
