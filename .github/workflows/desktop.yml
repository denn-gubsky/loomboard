name: Desktop

# Compiles and tests the desktop app's Rust side (src-tauri) whenever it
# changes, Dependabot's Cargo bumps among them. Without this it is compiled only
# by release.yml, on a tag, so a crate update that broke it would surface as a
# failed release. Linux only: the three native bundles still build at release.
# That an npm package and its crate stay on one major.minor (which `tauri build`
# requires) is checked by src/tauriVersions.test.ts, in ci.yml.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  rust:
    # The runner release.yml builds the Linux bundle on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # The same libraries release.yml installs for the Linux bundle.
      - name: Install Linux Tauri v2 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            build-essential

      # tauri::generate_context! reads build.frontendDist (../dist) when the
      # crate compiles, so the frontend is built first.
      - run: npm ci
      - run: npm run build:tauri

      # --locked: a Cargo.lock that no longer matches Cargo.toml fails here
      # rather than being rewritten on the runner.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
